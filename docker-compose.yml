version: '3'

services:
  invoice_ocr:
    build: .
    image: invoice-ocr:fastapi
    container_name: invoice_ocr_fastapi
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      - ./app/static/uploads:/app/app/static/uploads
    environment:
      # API密钥通过 Web 界面设置页配置；SECRET_KEY 建议在生产中显式设置
      - SECRET_KEY=${SECRET_KEY:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    networks:
      - invoice_ocr_network

networks:
  invoice_ocr_network:
    driver: bridge
